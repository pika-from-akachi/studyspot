<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FF7A3D" />
  <meta name="description" content="StudySpot — 校园空间与学生福祉导航平台 / Campus space & wellbeing navigation" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/app-icon.svg" />
  <link rel="apple-touch-icon" href="icons/app-icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>StudySpot</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top app bar -->
  <div class="app-header-wrap">
    <div class="status-bar"></div>
    <header class="app-header" id="app-header">
      <!-- Header content injected by router -->
    </header>
  </div>

  <!-- Scrollable main content -->
  <main class="app-main" id="app-main"></main>

  <!-- Bottom navigation -->
  <div class="bottom-bar-wrap">
    <nav class="bottom-nav" id="bottom-nav" aria-label="主导航"></nav>
    <div class="status-bar"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
